<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Musket &amp; Crown</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one-screen war table. An engraved campaign map sits on walnut; the orders desk sits below it on phones and beside it on wide screens. Home and battles take over the whole screen. */
:root{
  --table:#141b18; --walnut:#241d16; --walnut-2:#30271d; --line:#4a3c2c;
  --ink:#efe5cf; --muted:#b1a386; --brass:#cfa95e; --brass-ink:#1c160f;
  --danger:#d6634f; --good:#93b870; --warn:#e0a84a;
  --f-display:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --f-body:"Libre Caslon Text","Iowan Old Style",Georgia,serif;
  --f-ui:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--table);color:var(--ink);font-family:var(--f-ui);font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;padding-inline:16px;box-sizing:border-box;max-width:1180px;margin:0 auto}
.bar{display:flex;align-items:center;gap:10px;padding-block:8px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.02em;color:var(--brass);white-space:nowrap}
.date{font-family:var(--f-body);font-style:italic;color:var(--muted);font-size:13px}
.spacer{flex:1}
.res{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:6px}
.chip{background:var(--walnut);border:1px solid var(--line);border-radius:4px;padding:3px 7px;display:flex;align-items:baseline;gap:5px;font-variant-numeric:tabular-nums}
.chip small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip b{font-weight:600}
.chip i{font-style:normal;font-size:11px}
.pos{color:var(--good)} .neg{color:var(--danger)}
.btn{background:var(--walnut-2);border:1px solid var(--line);border-radius:4px;padding:7px 11px;line-height:1.2}
.btn:hover{border-color:var(--brass)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.brass{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:700}
.btn.red{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:5px 8px;font-size:12px}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
#mapwrap{flex:none;overflow:auto;max-width:100%;border-radius:3px;-webkit-overflow-scrolling:touch}
#mapbox{position:relative;width:max-content;margin:0 auto}
#zoom{position:absolute;right:6px;top:6px;z-index:2}
canvas{display:block;touch-action:manipulation}
#map{border:1px solid var(--line);border-radius:3px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#desk{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--walnut);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1;background:none;border:0;padding:9px 6px;font-family:var(--f-display);font-size:15px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
#panel{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
#panel h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px;text-wrap:balance}
#panel p{margin:0;font-family:var(--f-body);line-height:1.5;color:var(--muted);font-size:13.5px;max-width:65ch}
.sec{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.opt{text-align:left;display:flex;flex-direction:column;gap:2px;background:var(--walnut-2);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
.opt:hover:not([disabled]){border-color:var(--brass)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.opt[aria-pressed="true"]{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.opt b{font-family:var(--f-body);font-weight:700;font-size:13.5px}
.opt span{font-size:11.5px;color:var(--muted)}
.opt em{font-style:normal;font-size:11.5px;color:var(--brass);font-variant-numeric:tabular-nums}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-variant-numeric:tabular-nums;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.pill{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.st-war{color:var(--danger)} .st-peace{color:var(--good)} .st-alliance{color:var(--brass)} .st-neutral{color:var(--muted)} .st-trade{color:#8fc0d8} .st-truce{color:var(--warn)}
.rival{border:1px solid var(--line);border-radius:5px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--walnut-2)}
.rhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rhead b{font-family:var(--f-display);font-size:18px;font-weight:400}
.sw{width:12px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.5);display:inline-block;flex:none}
.relbar{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--danger),var(--line) 50%,var(--good))}
.relbar i{position:absolute;top:-3px;width:3px;height:12px;background:var(--ink);border-radius:1px;transform:translateX(-50%)}
.meter{height:8px;background:var(--walnut-2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%}
.power-row{padding:7px 0}
.power-row .row{justify-content:space-between;font-size:12px;margin-bottom:5px}
.power-ranking>summary{font-size:15px}
.project{padding:10px 0;border-bottom:1px solid var(--line)}
.project .row{font-size:13px;margin-bottom:7px}
.project small{display:block;color:var(--muted);font-size:11px;margin-top:5px;font-variant-numeric:tabular-nums}
.log{display:flex;flex-direction:column;gap:6px;font-family:var(--f-body);font-size:13px;line-height:1.45}
.log div{border-left:2px solid var(--line);padding-left:8px}
.log small{color:var(--muted);font-family:var(--f-ui);font-size:11px;margin-right:6px}
.note{border-left:2px solid var(--brass);padding:2px 0 2px 10px;font-family:var(--f-body);font-size:13.5px;line-height:1.5}
.foot{display:flex;gap:8px;align-items:center;padding-block:10px}
.foot .btn.brass{flex:1;padding:12px;font-family:var(--f-display);font-size:18px;font-weight:400}
.hint{font-size:12px;color:var(--muted);flex:2;line-height:1.35}
#modal{position:fixed;inset:0;background:rgba(8,10,9,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.card{background:var(--walnut);border:1px solid var(--brass);border-radius:6px;max-width:520px;width:100%;max-height:86vh;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);box-sizing:border-box}
.card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--brass);text-wrap:balance}
.card p,.card li{font-family:var(--f-body);line-height:1.55;font-size:14px;margin:0}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.msg{border:1px solid var(--line);border-radius:5px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--walnut-2)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--walnut-2);border:1px solid var(--brass);border-radius:5px;padding:9px 13px;font-family:var(--f-body);font-size:13.5px;max-width:min(90vw,440px);z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.portrait{flex:none;display:block}
.portrait-oil{position:relative;overflow:hidden;border-radius:50% / 43%;border:2px solid #c9a75f;background:#2d2119;box-shadow:0 0 0 1px #50391d,0 3px 8px rgba(0,0,0,.5)}
.portrait-oil img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 37%}
.portrait-oil.hostile{border-color:#a15a50;filter:saturate(.88)}
.portrait-oil.friendly{border-color:#d9be73;filter:saturate(1.07)}
.court{display:flex;gap:12px;align-items:center;min-width:0}
.court b{font-family:var(--f-display);font-size:19px;font-weight:400;display:block}
.court small{font-family:var(--f-body);font-style:italic;color:var(--muted);font-size:12.5px}
.msg .court b{font-size:16px}
.sound-level{display:grid;grid-template-columns:105px minmax(80px,1fr) 42px;gap:10px;align-items:center;font-family:var(--f-body);font-size:13px}
.sound-level input{width:100%;accent-color:var(--brass)}
.sound-level output{text-align:right;color:var(--brass);font-family:var(--f-ui);font-variant-numeric:tabular-nums}
.nations{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.nations .opt{flex-direction:row;align-items:center;gap:8px}
/* home */
#home{position:fixed;inset:0;z-index:25;background:#0d0f0e;overflow:hidden}
#homecv{position:absolute;inset:0;width:100%;height:100%}
.hwrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));box-sizing:border-box;max-width:520px;margin:0 auto;gap:18px}
.htitle{font-family:var(--f-display);font-size:clamp(44px,13vw,72px);line-height:.92;color:#f3e3b8;text-shadow:0 3px 18px rgba(0,0,0,.8);margin:0;text-wrap:balance}
.hsub{font-family:var(--f-body);font-style:italic;color:#e6d7b4;font-size:15px;text-shadow:0 2px 10px rgba(0,0,0,.9);margin:0}
.hmenu{display:flex;flex-direction:column;gap:8px}
.hmenu .btn{background:rgba(26,21,16,.82);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:12px 14px;font-family:var(--f-display);font-size:19px;text-align:left;border-color:rgba(207,169,94,.45)}
.hmenu .btn.brass{background:var(--brass);color:var(--brass-ink)}
.hmenu .btn small{display:block;font-family:var(--f-ui);font-size:11.5px;opacity:.75;margin-top:2px}
/* battle */
@media(min-width:1000px){#battle{display:grid!important;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr)}#battle[hidden]{display:none!important}.bhead{grid-column:1/-1}.bfield{grid-column:1;grid-row:2}.bctl{grid-column:2;grid-row:2;max-height:100%!important;justify-content:center}.bctl .row{gap:6px}}

#battle{position:fixed;inset:0;background:var(--table);z-index:20;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top,0px)) 16px calc(8px + env(safe-area-inset-bottom,0px));gap:6px;box-sizing:border-box}
.bhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.btitle{font-family:var(--f-display);font-size:24px;color:var(--brass);line-height:1}
.bsub{font-family:var(--f-body);font-style:italic;font-size:12.5px;color:var(--muted)}
#bnotice{font-size:13px;color:var(--brass);min-height:2.5em;max-width:650px;line-height:1.25;padding-top:4px}
.bstat{display:flex;gap:10px;font-variant-numeric:tabular-nums;font-size:13px}
.bstat span{display:flex;align-items:center;gap:5px}
.bfield{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#bcv{border:1px solid var(--line);border-radius:3px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.bctl{display:flex;flex-direction:column;gap:3px;align-items:center;max-height:42vh;overflow-y:auto;flex-shrink:0;width:100%}
.bctl .btn.sm{padding:8px 10px;font-size:13px;min-height:40px}
.bctl .row{justify-content:center}
.bquick{display:flex;gap:6px;justify-content:center;flex-shrink:0;padding:5px 0;background:var(--table);z-index:3}
.bquick .btn{min-height:44px;flex:1;max-width:190px;font-size:13px}
.battle-advice{font-size:12px;line-height:1.4;color:var(--brass);padding:2px 6px;text-align:center;max-width:620px}
.context-help{border-left:3px solid var(--brass);padding:8px 10px;background:var(--walnut-2);display:flex;flex-direction:column;gap:6px}
.context-help .btn{align-self:flex-start;min-height:40px}
summary{cursor:pointer;color:var(--brass);padding:8px 0;font-size:13px;line-height:1.4}
.service-history .note{margin-top:10px}.service-history small{line-height:1.5;color:var(--muted)}
#recovery{border:1px solid var(--brass);padding:8px;margin-bottom:6px;font-size:13px;line-height:1.4;max-height:18vh;overflow:auto}
#bres{max-height:90%;overflow-y:auto;z-index:4}
@media(min-width:1000px){#battle{grid-template-rows:auto minmax(0,1fr) auto}.bquick{grid-column:1/-1;grid-row:3}}
@media(max-width:599px){#battle{padding-left:8px;padding-right:8px}.bctl{max-height:36vh}.bctl .btn.sm{min-height:44px;padding:7px 9px}.btitle{font-size:21px}.bhead{gap:4px}#bnotice{min-height:0;font-size:12px;max-height:3.5em;overflow:hidden}.bquick .btn{padding:7px 5px}}
.bctl .lbl{min-width:0;text-align:left}
.order-section{width:100%;box-sizing:border-box;padding:8px 6px;border-top:1px solid var(--line)}
.order-section .order-section{padding:6px 0;border:0}
.order-section .lbl{margin-bottom:7px}
.order-section .row{justify-content:flex-start}
.order-help{font-size:12px;line-height:1.45;color:var(--muted);margin:7px 0 0}
.order-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.bctl .border-option{text-align:left;white-space:normal;padding:8px;min-height:62px}
.border-option b,.border-option small{display:block}
.border-option small{font-size:11px;font-weight:400;line-height:1.3;margin-top:4px;opacity:.85}
.bctl>.bsel{padding:5px 6px;text-align:left;align-self:stretch}
.bsel{font-size:12.5px;color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}
#bzoom{position:absolute;top:6px;right:6px;z-index:2;display:flex;gap:4px}
#bzoom .btn{background:rgba(26,21,16,.82);min-width:34px}
#bzoom .btn.brass{background:var(--brass)}
#bres{position:absolute;inset:auto 0;margin:auto;max-width:360px}
@media (min-width:860px){ main{flex-direction:row;align-items:stretch} #mapwrap{align-self:flex-start;max-height:calc(100vh - 150px)} #desk{max-width:400px} }
@media (prefers-reduced-motion:no-preference){ #toast{animation:rise .25s ease-out} @keyframes rise{from{transform:translate(-50%,8px);opacity:.3}} }
</style>

<div id="app">
  <div class="bar">
    <span class="brand">Musket &amp; Crown</span>
    <span class="date" id="date"></span>
    <span class="spacer"></span>
    <button class="btn sm" data-act="home">Home</button>
  </div>
  <div class="res" id="res"></div>
  <div id="recovery" hidden role="status"></div>
  <main>
    <div id="mapwrap"><div id="mapbox"><canvas id="map" aria-label="Campaign map"></canvas><button class="btn sm" id="zoom" data-act="zoom">Zoom in</button></div></div>
    <section id="desk">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="panel"></div>
    </section>
  </main>
  <div class="foot">
    <span class="hint" id="hint"></span>
    <button class="btn brass" data-act="endturn" id="endbtn">End season</button>
  </div>
</div>
<div id="home" role="dialog" aria-modal="true" aria-label="Musket and Crown main menu"><canvas id="homecv" aria-hidden="true"></canvas><div class="hwrap">
  <div><h1 class="htitle">Musket &amp; Crown</h1><p class="hsub">Six crowns, one continent. From 1740, until one stands.</p></div>
  <div class="hmenu" id="hmenu"></div>
</div></div>
<div id="battle" role="dialog" aria-modal="true" aria-labelledby="btitle" hidden>
  <div class="bhead"><div><div class="btitle" id="btitle"></div><div class="bsub" id="bsub"></div><div id="bnotice" role="status" aria-live="polite">Give orders to your selected troops</div></div><div class="bstat" id="bstat"></div></div>
  <div class="bfield"><div id="bzoom"><button class="btn sm" data-act="bz" data-v="in" aria-label="Zoom in">+</button><button class="btn sm" data-act="bz" data-v="out" aria-label="Zoom out">−</button><button class="btn sm" data-act="bz" data-v="fort" id="bzfort" hidden>View fort</button><button class="btn sm" data-act="bz" data-v="auto" id="bzauto">Follow</button></div><canvas id="bcv" aria-label="Battlefield. Tap one of your units to command it."></canvas><div class="card" id="bres" role="dialog" aria-modal="true" aria-label="Battle result" hidden></div></div>
  <div class="bctl" id="bctl"></div>
  <div class="bquick" id="bquick"></div>
</div>
<div id="modal" role="dialog" aria-modal="true" aria-label="Campaign options" hidden><div class="card" id="card" tabindex="-1"></div></div>
<div id="toast" hidden></div>
